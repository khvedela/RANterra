[package]
name = "ranterra-engine"
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT"
description = "Deterministic browser-independent radio and 5GS protocol playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxirush-nas = { version = "=0.4.0", features = ["security"] }
oxirush-security = "=0.2.0"
milenage = "=0.3.1"
sha2 = "0.10"
rasn = "=0.28.15"
subtle = "2"
zeroize = "1"
oxirush-ngap = "=0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex-literal = "0.4"
