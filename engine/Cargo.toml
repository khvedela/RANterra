[package]
name = "ranterra-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic browser-independent radio and 5GS protocol playground"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxirush-nas = "=0.4.0"
oxirush-ngap = "=0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
