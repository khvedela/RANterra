name: Research validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache-dependency-path: validation/free5gc/go.sum
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run test:inputs
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:wasm && npm run test:worker && npm run test:replay && npm run test:protocols
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:soak
      - run: npm audit --audit-level=moderate
      - run: cargo audit && cargo audit --file validation/fuzz/Cargo.lock
      - run: node scripts/check-licenses.mjs && python3 scripts/check-validation-licenses.py
      - run: python3 scripts/audit-validation.py
      - run: python3 scripts/generate-kdf-vectors.py > /tmp/kdf.json && diff engine/tests/kdf-vectors.json /tmp/kdf.json
      - run: node scripts/verify-build.mjs && npm run build && node scripts/verify-build.mjs --compare
      - run: cargo run --release --locked -p ranterra-engine --example benchmark && npm run benchmark:wasm
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ranterra-static-candidate
          path: |
            dist/
            build-manifest.json
            docs/V1_RELEASE_REPORT.md
            docs/DEPENDENCIES.json
            test-results/validation-go-audit.json
            test-results/wasm-soak.json

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-07-20
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: validation/fuzz
      - run: cargo +nightly-2026-07-20 install cargo-fuzz --version 0.13.2 --locked
      - run: sh scripts/fuzz-protocols.sh 60
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: fuzz-failure-inputs
          path: validation/fuzz/artifacts/
